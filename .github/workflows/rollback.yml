name: Rollback

# Redeploy a previously-published image tag over SSH. Same prerequisites and
# secrets as deploy.yml. Database migrations are NOT reverted automatically —
# a schema rollback is a manual, reviewed operation (restore from a pre-deploy
# backup if required; see scripts/README.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Known-good image tag to roll back to"
        required: true

# Shares deploy's concurrency group so a rollback never overlaps a deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Roll back over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.event.inputs.tag }}
          OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,OWNER,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/aegis
            export IMAGE_PREFIX="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
            export IMAGE_TAG
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            ok=0
            for _ in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T backend \
                   node -e "fetch('http://127.0.0.1:5000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                ok=1; break
              fi
              sleep 4
            done
            if [ "$ok" -ne 1 ]; then echo "readiness gate failed after rollback"; exit 1; fi
            echo "rollback OK: $IMAGE_PREFIX @ $IMAGE_TAG"
