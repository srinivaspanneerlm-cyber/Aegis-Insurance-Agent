name: Security

# Dependency + filesystem vulnerability scanning. Runs on every push/PR and
# weekly (to catch newly-disclosed advisories in unchanged code).
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (frontend + backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Gate on CRITICAL prod advisories only (dev-only + lower severities are
      # reported but don't block — keeps the gate meaningful, not noisy).
      - name: Backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=critical
      - name: Frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical

  pip-audit:
    name: pip-audit (AI engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      # Report-only: Python advisories often need manual triage / upstream fixes.
      - name: Audit requirements
        working-directory: ai-python
        continue-on-error: true
        run: pip-audit -r requirements.txt

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository (vuln + secrets)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
