# HTTP edge + reverse proxy. Serves traffic today and the ACME challenge for
# certificate issuance. After certs exist, enable tls.conf (see nginx/README.md)
# to add the HTTPS server + 80->443 redirect; keep the ACME location on :80.

server {
  listen 80;
  server_name _;

  # Security headers for edge/frontend responses (helmet covers API responses).
  # NOTE: nginx does not inherit add_header into locations that set their own.
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Certbot webroot challenge (stays on HTTP even after TLS is enabled).
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # nginx self-health (independent of upstreams) — used by the compose healthcheck.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # ── Advisor SSE stream — MUST NOT be buffered. Both the unversioned alias and
  # the versioned path map to the same backend handler; buffering here would
  # hold tokens back and break the streaming/voice UX.
  location ~ ^/api/(v1/)?chat/stream$ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding on;
    add_header X-Accel-Buffering no;
  }

  # ── Socket.io (realtime / voice): WebSocket upgrade + long-polling ───────────
  location /socket.io/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # ── REST API ─────────────────────────────────────────────────────────────────
  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Next.js immutable static assets — long-lived cache ───────────────────────
  location /_next/static/ {
    proxy_pass http://frontend;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ── Frontend (everything else) ───────────────────────────────────────────────
  location / {
    limit_req zone=general burst=40 nodelay;
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
