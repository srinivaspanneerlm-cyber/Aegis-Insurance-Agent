# ═════════════════════════════════════════════════════════════════════════════
# Aegis AI — NGINX edge (main config). The single public entry point in prod.
# Server blocks live in conf.d/ (aegis.conf = HTTP + reverse proxy; enable
# tls.conf after certs are issued — see nginx/README.md).
# ═════════════════════════════════════════════════════════════════════════════
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rt=$request_time uct="$upstream_connect_time" urt="$upstream_response_time"';
  access_log /var/log/nginx/access.log main;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  server_tokens   off;            # never leak the nginx version
  # Edge cap: must stay ABOVE UPLOAD_MAX_BYTES (50m) or nginx 413s a file the
  # app would have accepted, and the customer never reaches our error message.
  client_max_body_size 52m;

  # ── Compression ─────────────────────────────────────────────────────────────
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript
             text/javascript application/xml application/xml+rss
             image/svg+xml application/font-woff2;

  # ── Per-IP rate-limit zones (applied per-location) ───────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m     rate=20r/s;
  limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;
  limit_req_status 429;

  # ── WebSocket upgrade: "upgrade" for WS, "close" for socket.io long-polling ──
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── Upstreams (compose service DNS names on the edge network) ────────────────
  upstream frontend { server frontend:3000; keepalive 16; }
  upstream backend  { server backend:5000;  keepalive 16; }

  include /etc/nginx/conf.d/*.conf;
}
