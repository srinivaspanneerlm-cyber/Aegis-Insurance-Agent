# Workspace membership grows one application at a time.
#
# `frontend/` joined in Phase 2, which is the migration this file always
# anticipated: it is the customer portal people actually reach, and it could not
# import a single shared package while it sat outside. Being outside meant the
# only way to give it the document, advice, communication and knowledge UI would
# have been to copy those components into it — which is the duplication the
# monorepo exists to prevent.
#
# `backend/` and `ai-python/` remain outside deliberately. Neither is a
# TypeScript front end; the backend installs with npm and ai-python with pip,
# and neither consumes an `@aegis/*` package. Pulling them in would rewrite
# their dependency resolution for no benefit at all.
packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
  - "frontend"
